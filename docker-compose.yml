version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_ALLOW_CUSTOM_BASE_URL=${LLM_ALLOW_CUSTOM_BASE_URL:-false}
      - LLM_ALLOWED_HOSTS=${LLM_ALLOWED_HOSTS:-}
      - TSL_ADMIN_TOKEN=${TSL_ADMIN_TOKEN:-}
      - TSL_CORS_ORIGINS=${TSL_CORS_ORIGINS:-}
    restart: unless-stopped

  web:
    build: .
    command: streamlit run web/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_ALLOW_CUSTOM_BASE_URL=${LLM_ALLOW_CUSTOM_BASE_URL:-false}
      - LLM_ALLOWED_HOSTS=${LLM_ALLOWED_HOSTS:-}
      - TSL_ADMIN_TOKEN=${TSL_ADMIN_TOKEN:-}
      - TSL_CORS_ORIGINS=${TSL_CORS_ORIGINS:-}
    restart: unless-stopped
    depends_on:
      - api
