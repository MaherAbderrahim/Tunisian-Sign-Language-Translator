00" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="117.0879" x="228.0421" y="469.2125">57 signes &#215; 4 langues</text></g><!--entity UC7--><g class="entity" data-entity="UC7" data-source-line="25" data-uid="ent0011" id="entity_UC7"><ellipse cx="286.6342" cy="772.0179" fill="#F4F7FB" rx="79.1342" ry="20.7979" style="stroke:#4472C4;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="118.0547" x="227.6069" y="771.0758">Traduire un texte saisi</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="60.0234" x="256.6225" y="784.8747">(hors ligne)</text></g><!--entity UC8--><g class="entity" data-entity="UC8" data-source-line="26" data-uid="ent0012" id="entity_UC8"><ellipse cx="629.6403" cy="378.1065" fill="#F4F7FB" rx="90.1403" ry="22.3865" style="stroke:#4472C4;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="124.0488" x="567.6158" y="374.7881">Faire corriger la phrase</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="120.7383" x="569.2711" y="388.587">par un LLM (optionnel)</text></g><!--entity UC9--><g class="entity" data-entity="UC9" data-source-line="27" data-uid="ent0013" id="entity_UC9"><ellipse cx="286.6501" cy="538.05" fill="#F4F7FB" rx="99.6501" ry="22.33" style="stroke:#4472C4;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="147.4219" x="212.9391" y="535.8461">R&#233;gler le seuil de confiance</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="120.7441" x="226.278" y="549.645">et la fen&#234;tre de lissage</text></g><!--entity UC10--><g class="entity" data-entity="UC10" data-source-line="28" data-uid="ent0014" id="entity_UC10"><ellipse cx="286.4839" cy="617.126" fill="#F4F7FB" rx="77.4839" ry="21.406" style="stroke:#4472C4;s