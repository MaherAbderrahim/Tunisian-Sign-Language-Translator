<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSL Translator - Tunisian Sign Language</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <header>
        <h1>TSL Translator</h1>
        <p>Tunisian Sign Language → Text Translation</p>
    </header>

    <main>
        <!-- Status Bar -->
        <div id="status-bar" class="status-bar">
            <span id="ws-status" class="status disconnected">Disconnected</span>
            <span id="mode-status" class="mode">Mode: SIGN</span>
            <button id="btn-toggle-mode" class="btn btn-sm" disabled>Toggle Mode</button>
        </div>

        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab active" data-tab="camera">Camera</button>
            <button class="tab" data-tab="upload">Upload</button>
            <button class="tab" data-tab="settings">Settings</button>
        </div>

        <!-- Camera Tab -->
        <div id="tab-camera" class="tab-content active">
            <div class="camera-layout">
                <div class="video-container">
                    <video id="video" autoplay playsinline></video>
                    <canvas id="overlay"></canvas>
                    <div id="camera-placeholder" class="placeholder">
                        Click "Start Camera" to begin
                    </div>
                </div>
                <div class="controls">
                    <button id="btn-start-camera" class="btn btn-primary">Start Camera</button>
                    <button id="btn-stop-camera" class="btn btn-danger" disabled>Stop Camera</button>
                    <button id="btn-flush" class="btn" disabled>Flush Sentence</button>
                </div>
            </div>
        </div>

        <!-- Upload Tab -->
        <div id="tab-upload" class="tab-content">
            <div class="upload-area" id="drop-zone">
                <input type="file" id="file-input" accept="image/*,video/*" hidden>
                <p>Drag & drop an image or video here</p>
                <p>or</p>
                <button id="btn-select-file" class="btn btn-primary">Select File</button>
            </div>
            <div id="upload-preview" class="preview" hidden>
                <img id="preview-image" hidden>
                <video id="preview-video" controls hidden></video>
                <button id="btn-translate-upload" class="btn btn-primary">Translate</button>
            </div>
            <div class="upload-options">
                <label for="sample-rate">Détail vidéo</label>
                <select id="sample-rate">
                    <option value="4">Rapide — 1 image sur 4</option>
                    <option value="1">Précis — chaque image (plus lent, plus de signes détectés)</option>
                </select>
                <label for="target-lang">Langue de la phrase</label>
                <select id="target-lang">
                    <option value="en" selected>English</option>
                    <option value="fr">Français</option>
                    <option value="ar">العربية</option>
                    <option value="tunisian">Tunisien (derja)</option>
                </select>
            </div>
            <div id="upload-progress" class="progress" hidden>
                <div class="spinner"></div>
                <span>Processing...</span>
            </div>
            <div id="upload-result" class="upload-result" hidden></div>
        </div>

        <!-- Settings Tab -->
        <div id="tab-settings" class="tab-content">
            <div class="settings-grid">
                <!-- LLM Settings -->
                <div class="setting-card">
                    <h3>LLM Correction</h3>
                    <div class="form-group">
                        <label for="llm-provider">Provider</label>
                        <select id="llm-provider">
                            <option value="openrouter">OpenRouter</option>
                            <option value="openai">OpenAI</option>
                            <option value="anthropic">Anthropic</option>
                            <option value="ollama">Ollama (Local)</option>
                            <option value="custom">Custom</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="llm-api-key">API Key</label>
                        <input type="password" id="llm-api-key" placeholder="sk-..." autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="llm-model">Model</label>
                        <input type="text" id="llm-model" placeholder="openrouter/free" autocomplete="off">
                    </div>
                    <div class="form-group" id="custom-url-group" hidden>
                        <label for="llm-base-url">Base URL</label>
                        <input type="text" id="llm-base-url" placeholder="http://localhost:1234/v1">
                    </div>
                    <button id="btn-save-llm" class="btn btn-primary">Save LLM Config</button>
                    <div id="llm-status" class="setting-status"></div>
                    <div id="llm-active" class="setting-active"></div>
                </div>

                <!-- TSL Settings -->
                <div class="setting-card">
                    <h3>Translation Settings</h3>
                    <div class="form-group">
                        <label for="confidence-threshold">Confidence Threshold</label>
                        <input type="range" id="confidence-threshold" min="0" max="1" step="0.05" value="0.5"
                               aria-describedby="confidence-value">
                        <span id="confidence-value">0.5</span>
                    </div>
                    <div class="form-group">
                        <label for="smoothing-window">Smoothing Window</label>
                        <input type="number" id="smoothing-window" min="1" max="60" value="5">
                    </div>
                    <button id="btn-save-settings" class="btn btn-primary">Save Settings</button>
                    <div id="settings-status" class="setting-status"></div>
                </div>
            </div>
        </div>

        <!-- Translation Output -->
        <div class="output-section">
            <h2>Translation Output</h2>
            <div id="translation-output" class="translation-box">
                <div class="translation-row">
                    <label>Raw:</label>
                    <span id="output-raw" class="output-text">—</span>
                </div>
                <div class="translation-row corrected">
                    <label>Corrected:</label>
                    <span id="output-corrected" class="output-text">—</span>
                </div>
                <div class="translation-row">
                    <label>Confidence:</label>
                    <span id="output-confidence" class="output-text">—</span>
                </div>
            </div>
        </div>

        <!-- History -->
        <div class="history-section">
            <h2>History <button id="btn-clear-history" class="btn btn-sm">Clear</button></h2>
            <div id="history-list" class="history-list">
                <p class="empty">No translations yet</p>
            </div>
        </div>
    </main>

    <script src="app.js?v=4"></script>
</body>
</html>
